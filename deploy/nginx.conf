# nginx site for the Employee Portal on EC2.
# Installed at /etc/nginx/sites-available/shraddha-employee-portal.
#
# One origin serves both halves: the SPA from frontend/dist, and /api + /health
# proxied to the PM2 backend on 4001. Same origin means VITE_API_URL stays empty
# and the refresh cookie can stay SameSite=Strict.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/shraddha-employee-portal/frontend/dist;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4001;
    }

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback, and never cache index.html so a deploy shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
